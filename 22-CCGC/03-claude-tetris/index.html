<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
    <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
    <span id="theme-toggle-label">Oscuro</span>
  </button>

  <h1 class="game-title">TETRIS</h1>

  <div class="mode-bar">
    <div class="mode-row">
      <select id="mode-select" aria-label="Modo de juego"></select>
      <span id="objective-progress"></span>
    </div>
    <span id="objective-text"></span>
  </div>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-row">
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>
        </div>

        <div class="panel-row">
          <div class="panel-section">
            <span class="label">POWER-UP</span>
            <span class="value" id="power-up-progress">0/5</span>
          </div>
          <div class="panel-section">
            <span class="label">COMBO</span>
            <span class="value" id="combo">-</span>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>M</kbd> sonido</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
